---
kind: "DatadogAgent"
apiVersion: "datadoghq.com/v2alpha1"
metadata:
  name: "datadog"
  namespace: "datadog"
spec:
  global:
    clusterName: "ccdist"
    kubelet:
      tlsVerify: false
    site: "datadoghq.com"
    credentials:
      apiSecret:
        secretName: "datadog-secret"
        keyName: "api-key"
    tags:
      - "env:prod"
  override:
    nodeAgent:
      env:
        - name: DD_IGNORE_AUTOCONF
          value: "etcd"
      extraConfd: # https://docs.datadoghq.com/containers/kubernetes/control_plane/?tab=datadogoperator#TalosLinux
        configDataMap:
          etcd.yaml: |-
            # The scheduler identifies control-plane nodes, including Talos etcd.
            ad_identifiers:
              - kube-scheduler
            init_config: {}
            instances:
              # Talos 1.14 serves HTTP metrics on 2383; 2379 is gRPC-only.
              - prometheus_url: https://%%host%%:2383/metrics
                tls_ca_cert: /host/etc/kubernetes/pki/etcd/ca.crt
                tls_cert: /host/etc/kubernetes/pki/etcd/server.crt
                tls_private_key: /host/etc/kubernetes/pki/etcd/server.key
      containers:
        agent:
          volumeMounts:
            - name: etcd-certs
              mountPath: /host/etc/kubernetes/pki/etcd
              readOnly: true
      volumes:
        - name: etcd-certs
          hostPath:
            path: /system/secrets/etcd
            # Workers have no etcd certificates; their checks are not scheduled.
            type: DirectoryOrCreate
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
  features:
    appsec:
      injector:
        enabled: true
    clusterChecks:
      enabled: true
    orchestratorExplorer:
      enabled: true
    apm:
      instrumentation:
        enabled: true
        targets:
          - name: "default-target"
            ddTraceConfigs:
              - name: "DD_PROFILING_ENABLED"
                value: "auto"
              - name: "DD_DATA_STREAMS_ENABLED"
                value: "true"
    logCollection:
      enabled: true
      containerCollectAll: true
    otelCollector:
      enabled: true
      ports:
        - containerPort: 4317
          hostPort: 4317
          name: "otel-grpc"
        - containerPort: 4318
          hostPort: 4318
          name: "otel-http"
    asm:
      threats:
        enabled: true
      sca:
        enabled: true
      iast:
        enabled: true
    cws:
      enabled: true
    cspm:
      enabled: true
    sbom:
      enabled: true
      enrichment:
        usage:
          enabled: true
      containerImage:
        enabled: true
      host:
        enabled: true
    usm:
      enabled: true
    npm:
      enabled: true
    liveProcessCollection:
      enabled: true
