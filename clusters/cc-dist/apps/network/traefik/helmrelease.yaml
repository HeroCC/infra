---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: network
spec:
  interval: 30m
  dependsOn:
    - name: traefik-crds
      namespace: network
  chart:
    spec:
      chart: traefik
      version: 42.3.1
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    fullnameOverride: traefik
    rbac:
      enabled: true
    deployment:
      replicas: 2
    service:
      annotations:
        external-dns.kubernetes.io/hostname: distcc.${SECRET_DOMAIN}
        external-dns.kubernetes.io/target: ${CLOUDFLARE_TUNNEL_ID}.cfargotunnel.com
      spec:
        type: ClusterIP
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-tunnel
    ingressRoute:
      dashboard:
        enabled: false
      healthcheck:
        enabled: false
    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: traefik-tunnel
        publishedService:
          enabled: false
      kubernetesCRD:
        enabled: true
        ingressClass: traefik-tunnel
        # Routes reference the shared authentication chain in network.
        allowCrossNamespace: true
        allowExternalNameServices: false
    ports:
      web:
        forwardedHeaders:
          # Cloudflared connects from the cluster pod network, not the Internet.
          trustedIPs:
            - 10.244.0.0/16
      websecure:
        expose:
          default: false
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
