apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: network
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ccdist-external-dns
rules:
  - apiGroups: [""]
    resources: [services, pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ccdist-external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ccdist-external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: network
