apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: network
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.24.0
          args:
            - --source=ingress
            - --source=service
            - --provider=cloudflare
            - --domain-filter=${SECRET_DOMAIN}
            - --ingress-class=traefik-tunnel
            - --annotation-prefix=external-dns.kubernetes.io/
            - --registry=txt
            - --txt-owner-id=ccdist
            - --txt-prefix=ccdist-
            - --policy=sync
            - --cloudflare-proxied
            - --cloudflare-record-comment=external-dns ccdist
            - --interval=1m
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
