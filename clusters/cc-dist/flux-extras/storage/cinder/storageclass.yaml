apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cinder-csail
provisioner: cinder.csi.openstack.org
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain
parameters:
  # Pin the real Cinder AZ while cloud.conf preserves the full requested
  # topology (region and zone) in each provisioned PV's node affinity.
  availability: nova
allowedTopologies:
  - matchLabelExpressions:
      - key: topology.kubernetes.io/region
        values:
          - CSAIL_Stata
      - key: topology.cinder.csi.openstack.org/zone
        values:
          - nova
