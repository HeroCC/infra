apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-crds
  namespace: network
spec:
  interval: 30m
  chart:
    spec:
      # Use the same chart pin as the app so the CRD schemas always match.
      chart: traefik
      version: 42.4.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Render only the chart's CRDs, without application resources.
    deployment:
      enabled: false
    service:
      enabled: false
    rbac:
      enabled: false
    serviceAccount:
      name: default
    ingressClass:
      enabled: false
