apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: general-pings
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: info
  eventMetadata:
    cluster: cc-dist
  eventSources:
    - kind: GitRepository
      name: '*'
      namespace: '*'
    - kind: Kustomization
      name: '*'
      namespace: '*'
    - kind: HelmRepository
      name: '*'
      namespace: '*'
    - kind: HelmChart
      name: '*'
      namespace: '*'
    - kind: HelmRelease
      name: '*'
      namespace: '*'
