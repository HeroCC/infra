apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: datadog-operator
  namespace: datadog
spec:
  interval: 30m
  chart:
    spec:
      chart: datadog-operator
      version: 2.30.0
      sourceRef:
        kind: HelmRepository
        name: datadog-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
