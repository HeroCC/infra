apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/HeroCC/infra.git
  ref:
    branch: master
  # Local encryption rules are not a Kubernetes manifest.
  ignore: |
    /clusters/cc-dist/.sops.yaml
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./clusters/cc-dist
  prune: true
  # Children depend on this root; waiting for them would create a cycle.
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-extras
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 10m
  retryInterval: 1m
  path: ./clusters/cc-dist/flux-extras
  prune: true
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-keys
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-extras
  interval: 10m
  retryInterval: 1m
  path: ./clusters/cc-dist/apps
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-keys
  sourceRef:
    kind: GitRepository
    name: flux-system
